<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بوابة الحصص الأونلاين</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EDF1F6; --card:#FFFFFF; --ink:#16233B; --muted:#5A6B84; --line:#D5DEE9;
    --gold:#9A6B10; --warn:#B4232F; --sq:28px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    font-family:"Tajawal","Segoe UI",Tahoma,sans-serif; color:var(--ink);
    background-color:var(--paper);
    background-image:
      repeating-linear-gradient(to left, transparent 0 calc(var(--sq) - 1px), rgba(22,35,59,.055) calc(var(--sq) - 1px) var(--sq)),
      repeating-linear-gradient(to bottom, transparent 0 calc(var(--sq) - 1px), rgba(22,35,59,.055) calc(var(--sq) - 1px) var(--sq));
    line-height:1.7; min-height:100vh;
  }
  h1,h2,h3,.kufi{font-family:"Noto Kufi Arabic","Tajawal",Tahoma,sans-serif}
  h1{font-size:1.45rem;margin:0;font-weight:700;line-height:1.5}
  h2{font-size:1.15rem;margin:0 0 .6rem;font-weight:700}
  h3{font-size:1rem;margin:0;font-weight:500}
  p{margin:.35rem 0}
  button{font-family:inherit;font-size:1rem;cursor:pointer}
  :focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:2px}
  .wrap{max-width:760px;margin:0 auto;padding:18px 16px 56px}

  .top{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--ink);color:#fff;padding:12px 16px;position:sticky;top:0;z-index:5}
  .top.paid{background:#2B1F06}
  .top .brand{font-family:"Noto Kufi Arabic",sans-serif;font-size:1rem;font-weight:700}
  .top .who{font-size:.82rem;color:#B9C6DA;margin-top:2px}
  .linkbtn{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;padding:6px 12px;border-radius:3px;font-size:.85rem}
  .linkbtn:hover{background:rgba(255,255,255,.12)}

  .login{max-width:430px;margin:7vh auto 0;padding:0 16px 40px}
  .plate{position:relative;background:var(--card);border:1px solid var(--line);border-top:none;padding:26px 22px 24px;border-radius:5px;overflow:hidden;box-shadow:0 8px 26px rgba(22,35,59,.12)}
  .plate::before{content:"";position:absolute;top:0;right:0;left:0;height:6px;background:linear-gradient(to left,#2563EB,#7C3AED,#C2185B,#158A5E,#B45309,#0E7490)}
  .plate.gold::before{background:linear-gradient(to left,#D97706,#9A2C6B)}
  .sub{color:var(--muted);font-size:.92rem;margin:0 0 20px}
  label{display:block;font-size:.85rem;color:var(--muted);margin:14px 0 5px}
  input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);background:#fff;font-family:inherit;font-size:1rem;color:var(--ink);border-radius:3px}
  input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px rgba(22,35,59,.12)}
  .btn{width:100%;margin-top:20px;padding:13px;border:none;background:var(--ink);color:#fff;font-family:"Noto Kufi Arabic",sans-serif;font-weight:500;border-radius:3px}
  .btn:hover{background:#22355a}
  .btn.gold{background:var(--gold)} .btn.gold:hover{filter:brightness(1.1)}
  .btn.small{width:auto;margin:0;padding:9px 16px;font-size:.9rem}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)} .btn.ghost:hover{background:#F2F6FB}
  .btn.danger{background:#fff;color:var(--warn);border:1px solid #E6C3C6}
  .err{color:var(--warn);font-size:.88rem;margin-top:12px;min-height:1.2em}
  .hint{color:var(--muted);font-size:.8rem;margin-top:16px;text-align:center}
  .linkish{background:none;border:none;color:var(--gold);text-decoration:underline;font-size:.9rem;padding:8px 0;width:100%;margin-top:8px}

  /* الصفحة الرئيسية */
  .rainbow{height:6px;background:linear-gradient(to left,#2563EB,#7C3AED,#C2185B,#158A5E,#B45309,#0E7490)}
  .gate{max-width:640px;margin:5vh auto 0;padding:0 16px 50px}
  .gate .hero{background:var(--card);border:1px solid var(--line);border-radius:5px;overflow:hidden;box-shadow:0 6px 22px rgba(22,35,59,.10)}
  .gate .heroin{padding:26px 22px 24px}
  .gate h1{font-size:1.75rem;line-height:1.45}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
  .chip{font-size:.78rem;color:#fff;background:var(--c);padding:3px 11px;border-radius:20px}
  .doors{display:grid;gap:14px;margin-top:22px}
  @media(min-width:640px){.doors{grid-template-columns:1fr 1fr}}
  .door{position:relative;overflow:hidden;text-align:right;color:#fff;border:none;padding:22px 20px 20px;border-radius:5px;
    display:block;width:100%;box-shadow:0 6px 18px rgba(22,35,59,.16);transition:transform .15s ease,box-shadow .15s ease;
    background:linear-gradient(135deg,#1D4ED8,#0E7490)}
  .door.gold{background:linear-gradient(135deg,#D97706,#9A2C6B)}
  .door:hover{transform:translateY(-3px);box-shadow:0 10px 24px rgba(22,35,59,.24)}
  .door::after{content:"";position:absolute;left:-30px;bottom:-45px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.12)}
  .door .dn{font-family:"Noto Kufi Arabic",sans-serif;font-size:1.15rem;font-weight:700;display:block;position:relative}
  .door .dd{font-size:.88rem;color:rgba(255,255,255,.88);margin-top:8px;display:block;position:relative}
  .door .dp,.door .df{position:relative;display:inline-block;margin-top:14px;font-size:.82rem;background:rgba(255,255,255,.22);color:#fff;padding:4px 12px;border-radius:20px}

  .steps{counter-reset:s;margin:16px 0 0;padding:0;list-style:none}
  .steps li{counter-increment:s;position:relative;padding:0 34px 14px 0;font-size:.93rem}
  .steps li::before{content:counter(s);position:absolute;right:0;top:2px;width:24px;height:24px;background:var(--gold);color:#fff;border-radius:50%;display:grid;place-items:center;font-size:.8rem}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
  @media(min-width:620px){.grid{grid-template-columns:1fr 1fr 1fr}}
  .subject{position:relative;overflow:hidden;text-align:right;background:var(--c);color:#fff;border:none;
    padding:16px 14px 14px;display:block;width:100%;border-radius:5px;
    box-shadow:0 4px 14px color-mix(in srgb,var(--c) 34%, transparent);
    transition:transform .15s ease,box-shadow .15s ease}
  .subject:hover{transform:translateY(-3px);box-shadow:0 9px 20px color-mix(in srgb,var(--c) 45%, transparent)}
  .subject .mk{position:absolute;left:6px;bottom:-14px;font-family:"Noto Kufi Arabic",sans-serif;font-size:3.6rem;
    font-weight:700;color:rgba(255,255,255,.20);line-height:1;pointer-events:none}
  .subject .nm{font-family:"Noto Kufi Arabic",sans-serif;font-size:1rem;font-weight:700;display:block;position:relative}
  .subject .ct{font-size:.8rem;color:rgba(255,255,255,.85);margin-top:6px;display:block;position:relative}
  .subject .ct.on{color:#fff;font-weight:700}
  .eyebrow{font-size:.85rem;color:var(--muted);margin:0 0 2px}

  .week{background:var(--card);border:1px solid var(--line);margin-top:10px;border-radius:5px;overflow:hidden;box-shadow:0 2px 8px rgba(22,35,59,.06)}
  .week.now{border-color:var(--c);box-shadow:inset 5px 0 0 var(--c),0 4px 14px rgba(22,35,59,.10)}
  .week.now .whead{background:color-mix(in srgb,var(--c) 9%, #fff)}
  .whead{width:100%;display:flex;align-items:center;gap:10px;justify-content:space-between;background:none;border:none;padding:13px 14px;text-align:right}
  .whead:hover{background:#F7FAFE}
  .wname{font-family:"Noto Kufi Arabic",sans-serif;font-size:.95rem}
  .tag{font-size:.72rem;background:var(--c);color:#fff;padding:2px 8px;border-radius:2px;margin-right:8px;white-space:nowrap}
  .meta{font-size:.82rem;color:var(--muted)}
  .wbody{padding:0 14px 12px;border-top:1px dashed var(--line)}
  .lesson{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between;padding:12px 0;border-bottom:1px dashed var(--line)}
  .lesson:last-child{border-bottom:none}
  .lesson .t{font-weight:500}
  .lesson .d{font-size:.82rem;color:var(--muted)}
  .join{background:var(--c);color:#fff;text-decoration:none;padding:9px 16px;border-radius:3px;font-family:"Noto Kufi Arabic",sans-serif;font-size:.85rem;white-space:nowrap}
  .join:hover{filter:brightness(.92)}
  .empty{color:var(--muted);font-size:.9rem;padding:14px 0 4px}

  .banner{background:#FFF8E7;border:1px solid #E7D6A8;border-right:5px solid #B45309;padding:12px 14px;border-radius:3px;margin-bottom:14px}
  .banner .lbl{font-family:"Noto Kufi Arabic",sans-serif;font-size:.8rem;color:#8A5A08;margin-bottom:2px}
  .banner .msg{white-space:pre-wrap}
  .groupbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:var(--card);border:1px solid var(--line);padding:12px 14px;border-radius:3px;margin-bottom:14px}
  .groupbar a{background:#158A5E;color:#fff;text-decoration:none;padding:9px 16px;border-radius:3px;font-family:"Noto Kufi Arabic",sans-serif;font-size:.85rem;white-space:nowrap}

  .panel{background:var(--card);border:1px solid var(--line);padding:18px 16px;margin-top:14px;border-radius:3px}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row > *{flex:1;min-width:130px}
  .tabs{display:flex;gap:8px;margin-top:12px}
  .tabs button{flex:1;padding:11px;border:1px solid var(--line);background:#fff;border-radius:3px;font-family:"Noto Kufi Arabic",sans-serif;font-size:.9rem}
  .tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .tabs button.on.gold{background:var(--gold);border-color:var(--gold)}
  table{width:100%;border-collapse:collapse;font-size:.88rem;margin-top:10px}
  th,td{text-align:right;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-family:"Noto Kufi Arabic",sans-serif;font-weight:500;font-size:.82rem;color:var(--muted)}
  td.num{direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
  code{background:#F1F4F9;padding:2px 7px;border-radius:2px;direction:ltr;display:inline-block;font-size:.95rem}
  .scroll{overflow-x:auto}
  .toast{position:fixed;bottom:18px;right:50%;transform:translateX(50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:3px;font-size:.9rem;z-index:9}
  .del{background:none;border:none;color:var(--warn);font-size:.85rem;padding:4px}
  .loading{text-align:center;color:var(--muted);padding:60px 0}
  @media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="loading">جارٍ التحميل…</div></div>
<script>
const SUBJECTS = [
  {id:'math',    name:'الرياضيات',           color:'#2563EB', mk:'٧'},
  {id:'science', name:'العلوم',              color:'#7C3AED', mk:'ع'},
  {id:'arabic',  name:'اللغة العربية',       color:'#C2185B', mk:'ض'},
  {id:'islamic', name:'التربية الإسلامية',   color:'#158A5E', mk:'إ'},
  {id:'social',  name:'الدراسات الاجتماعية', color:'#B45309', mk:'د'},
  {id:'english', name:'اللغة الإنجليزية',    color:'#0E7490', mk:'E'}
];
const ORD = ['','الأول','الثاني','الثالث','الرابع','الخامس','السادس','السابع','الثامن','التاسع','العاشر','الحادي عشر','الثاني عشر'];
const K_CONF='portal-config', K_LOG='portal-log', K_ME='portal-me';

const blankPortal = extra => Object.assign({weeks:8,currentWeek:1,lessons:{},announce:'',groupUrl:'',groupLabel:'انضم للمجموعة'}, extra||{});
const DEFAULTS = {
  siteTitle:'حصصنا الأونلاين',
  siteLine:'اختر بوابتك للدخول إلى حصص هذا الأسبوع.',
  adminCode:'admin2026', cc:'966',
  portals:{
    free: blankPortal({title:'البوابة العامة', desc:'الحصص الأساسية لكل طلاب الصف.', code:'1234'}),
    paid: blankPortal({title:'بوابة المشتركين', desc:'حصص التقوية والمراجعة للمشتركين.', price:'٣ ريال', payUrl:'', payNote:'بعد إتمام الدفع يصلك رمز الدخول على الواتساب خلال دقائق.', codes:[]})
  }
};

let conf=null, log=[], me={name:'',phone:''};
let view='landing', portal='free', isAdmin=false, adminPortal='free';
let curSubject=null, openWeek=null, err='', recorded=new Set();

async function sget(k,sh){ try{ const r=await window.storage.get(k,sh); return r?JSON.parse(r.value):null; }catch(e){ return null; } }
async function sset(k,v,sh){ try{ await window.storage.set(k,JSON.stringify(v),sh); return true; }catch(e){ toast('تعذّر الحفظ، حاول مرة أخرى'); return false; } }
const saveConf = () => sset(K_CONF, conf, true);
const P  = () => conf.portals[portal];
const AP = () => conf.portals[adminPortal];

async function boot(){
  const [c,l,m] = await Promise.all([sget(K_CONF,true), sget(K_LOG,true), sget(K_ME,false)]);
  conf = JSON.parse(JSON.stringify(DEFAULTS));
  if(c){
    if(c.portals){
      conf = Object.assign(conf, c);
      conf.portals.free = Object.assign(blankPortal(DEFAULTS.portals.free), c.portals.free||{});
      conf.portals.paid = Object.assign(blankPortal(DEFAULTS.portals.paid), c.portals.paid||{});
    } else {  /* ترقية الإعدادات القديمة */
      conf.adminCode = c.adminCode || conf.adminCode;
      conf.cc = c.cc || conf.cc;
      Object.assign(conf.portals.free, {
        code:c.studentCode||'1234', weeks:c.weeks||8, currentWeek:c.currentWeek||1,
        lessons:c.lessons||{}, announce:c.announce||'', groupUrl:c.groupUrl||'', groupLabel:c.groupLabel||'انضم للمجموعة'
      });
    }
  }
  if(!Array.isArray(conf.portals.paid.codes)) conf.portals.paid.codes = [];
  log = Array.isArray(l)?l:[];
  if(m) me=m;
  render();
}

async function record(subjectId){
  const key = portal+'|'+(subjectId||'login');
  if(recorded.has(key)) return;
  recorded.add(key);
  const fresh = await sget(K_LOG,true);
  log = Array.isArray(fresh)?fresh:log;
  log.push({n:me.name,p:me.phone,s:subjectId||'',g:portal,w:P().currentWeek,t:Date.now()});
  if(log.length>800) log = log.slice(-800);
  await sset(K_LOG,log,true);
}

const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const subj = id => SUBJECTS.find(s=>s.id===id);
const lessonsOf = (p,sid,w) => ((p.lessons[sid]||{})[w] || []);
const weekName = w => 'الأسبوع ' + (ORD[w]||w);
const fmt = ts => { const d=new Date(ts);
  return d.toLocaleDateString('ar-EG',{day:'2-digit',month:'2-digit'})+' · '+d.toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}); };
function toast(m){ const t=document.createElement('div'); t.className='toast'; t.textContent=m; document.body.appendChild(t); setTimeout(()=>t.remove(),2200); }
function safeUrl(u){ u=String(u||'').trim(); if(!u) return ''; if(!/^https?:\/\//i.test(u)) u='https://'+u; return /^https?:\/\//i.test(u)?u:''; }
function intlPhone(raw){
  let d=String(raw||'').replace(/\D/g,''); const cc=String(conf.cc||'').replace(/\D/g,'');
  if(!d) return ''; if(d.startsWith('00')) d=d.slice(2);
  if(cc && d.startsWith(cc)) return d;
  d=d.replace(/^0+/,''); return cc?cc+d:d;
}
function newCode(){
  const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let s='';
  for(let i=0;i<8;i++){ s+=A[Math.floor(Math.random()*A.length)]; if(i===3) s+='-'; }
  return s;
}

function render(){
  const app=document.getElementById('app');
  const v={landing:landingView, login:loginView, buy:buyView}[view];
  app.innerHTML = v ? v() : shell({home:homeView,subject:subjectView,admin:adminView}[view]());
  const f=app.querySelector('[autofocus]'); if(f) f.focus();
}

function shell(inner){
  return '<div class="top '+(portal==='paid'&&!isAdmin?'paid':'')+'">'+
    '<div><div class="brand">'+esc(isAdmin?'لوحة المعلّم':P().title)+'</div>'+
    '<div class="who">'+esc(isAdmin?conf.siteTitle:me.name)+'</div></div>'+
    '<button class="linkbtn" onclick="logout()">خروج</button></div><div class="rainbow"></div>'+
    '<div class="wrap">'+(isAdmin?'':notices())+inner+'</div>';
}
function notices(){
  const p=P(); let out='';
  if(p.announce && p.announce.trim())
    out += '<div class="banner"><div class="lbl">إعلان من المعلّم</div><div class="msg">'+esc(p.announce)+'</div></div>';
  const u=safeUrl(p.groupUrl);
  if(u) out += '<div class="groupbar"><span class="meta">وصلك كل جديد أولًا بأول عبر مجموعة الصف.</span>'+
    '<a href="'+esc(u)+'" target="_blank" rel="noopener">'+esc(p.groupLabel||'انضم للمجموعة')+'</a></div>';
  return out;
}

/* ===== الصفحة الرئيسية ===== */
function landingView(){
  const f=conf.portals.free, p=conf.portals.paid;
  const chips=SUBJECTS.map(s=>'<span class="chip" style="--c:'+s.color+'">'+esc(s.name)+'</span>').join('');
  return '<div class="gate"><div class="hero"><div class="rainbow"></div><div class="heroin">'+
    '<h1>'+esc(conf.siteTitle)+'</h1><p class="sub" style="margin-bottom:0">'+esc(conf.siteLine)+'</p>'+
    '<div class="chips">'+chips+'</div></div></div>'+
   '<div class="doors">'+
    '<button class="door" onclick="goLogin(\'free\')"><span class="dn">'+esc(f.title)+'</span>'+
      '<span class="dd">'+esc(f.desc||'')+'</span><span class="df">بالرمز العام</span></button>'+
    '<button class="door gold" onclick="goLogin(\'paid\')"><span class="dn">'+esc(p.title)+'</span>'+
      '<span class="dd">'+esc(p.desc||'')+'</span><span class="dp">'+esc(p.price||'بالاشتراك')+'</span></button>'+
   '</div>'+
   '<p class="hint">للمعلّم: ادخل من أي بوابة واستخدم رمز الإدارة.</p></div>';
}
function goLogin(which){ portal=which; view='login'; err=''; render(); }

/* ===== الدخول ===== */
function loginView(){
  const p=P(), gold = portal==='paid';
  return '<div class="login"><div class="plate '+(gold?'gold':'')+'">'+
    '<h1>'+esc(p.title)+'</h1>'+
    '<p class="sub">'+(gold?'أدخل رمز الاشتراك الذي وصلك بعد الدفع.':'اكتب بياناتك ورمز الدخول العام.')+'</p>'+
    '<label for="nm">الاسم الكامل</label><input id="nm" autofocus value="'+esc(me.name)+'" placeholder="مثال: سارة أحمد">'+
    '<label for="ph">رقم الجوال</label><input id="ph" type="tel" inputmode="tel" value="'+esc(me.phone)+'" placeholder="05xxxxxxxx">'+
    '<label for="cd">'+(gold?'رمز الاشتراك':'رمز الدخول')+'</label><input id="cd" '+(gold?'dir="ltr" placeholder="ABCD-1234"':'type="password" placeholder="الرمز الذي أعطاك إياه المعلّم"')+'>'+
    '<button class="btn '+(gold?'gold':'')+'" onclick="doLogin()">دخول</button>'+
    '<div class="err" id="er">'+esc(err)+'</div>'+
    (gold?'<button class="linkish" onclick="view=\'buy\';render()">ما عندك رمز؟ اشترك الآن</button>':'')+
    '<p class="hint">يُستخدم رقمك لإرسال إعلانات الحصص فقط.</p>'+
    '<button class="linkish" style="color:var(--muted)" onclick="view=\'landing\';err=\'\';render()">رجوع للصفحة الرئيسية</button>'+
  '</div></div>';
}

async function doLogin(){
  const name=document.getElementById('nm').value.trim();
  const phone=document.getElementById('ph').value.trim();
  const code=document.getElementById('cd').value.trim();
  if(code && code===conf.adminCode){ isAdmin=true; adminPortal=portal; me={name:'المعلّم',phone:'—'}; view='admin'; err=''; render(); return; }
  if(!name){ err='اكتب اسمك أولًا.'; render(); return; }
  if(phone.replace(/\D/g,'').length<7){ err='اكتب رقم جوال صحيح.'; render(); return; }

  if(portal==='free'){
    if(code!==conf.portals.free.code){ err='رمز الدخول غير صحيح. راجع معلّمك.'; render(); return; }
  } else {
    const fresh=await sget(K_CONF,true); if(fresh&&fresh.portals&&fresh.portals.paid) conf.portals.paid.codes=fresh.portals.paid.codes||[];
    const c=conf.portals.paid.codes.find(x=>x.code.toUpperCase()===code.toUpperCase());
    if(!c){ err='رمز الاشتراك غير صحيح أو منتهٍ.'; render(); return; }
    const mine=intlPhone(phone);
    if(c.by && c.by!==mine){ err='هذا الرمز مسجّل باسم مشترك آخر.'; render(); return; }
    if(!c.by){ c.by=mine; c.name=name; c.ts=Date.now(); await saveConf(); }
  }
  me={name,phone}; err=''; isAdmin=false; recorded=new Set(); sset(K_ME,me,false);
  view='home'; openWeek=P().currentWeek; render(); record(null);
}
function logout(){ view='landing'; isAdmin=false; err=''; recorded=new Set(); render(); }

/* ===== صفحة الاشتراك ===== */
function buyView(){
  const p=conf.portals.paid, u=safeUrl(p.payUrl);
  return '<div class="login"><div class="plate gold">'+
    '<h1>الاشتراك في '+esc(p.title)+'</h1>'+
    '<p class="sub">'+esc(p.desc||'')+'</p>'+
    '<div style="font-family:\'Noto Kufi Arabic\',sans-serif;font-size:1.3rem;color:var(--gold)">'+esc(p.price||'')+'</div>'+
    '<ol class="steps">'+
      '<li>ادفع بالبطاقة (فيزا أو مدى) عبر صفحة الدفع الآمنة.</li>'+
      '<li>'+esc(p.payNote||'يصلك رمز الاشتراك بعد إتمام الدفع.')+'</li>'+
      '<li>ارجع لهذه الصفحة وأدخل الرمز مع اسمك ورقمك.</li>'+
    '</ol>'+
    (u ? '<a class="btn gold" style="display:block;text-align:center;text-decoration:none" href="'+esc(u)+'" target="_blank" rel="noopener">ادفع بالبطاقة</a>'
       : '<p class="err">لم يُضف رابط الدفع بعد. تواصل مع المعلّم.</p>')+
    '<button class="linkish" style="color:var(--muted)" onclick="view=\'login\';render()">رجوع لصفحة الدخول</button>'+
  '</div></div>';
}

/* ===== المواد ===== */
function homeView(){
  const p=P();
  const cards=SUBJECTS.map(s=>{
    const n=lessonsOf(p,s.id,p.currentWeek).length;
    return '<button class="subject" style="--c:'+s.color+'" onclick="openSubject(\''+s.id+'\')">'+
      '<span class="mk">'+s.mk+'</span>'+
      '<span class="nm">'+esc(s.name)+'</span>'+
      '<span class="ct '+(n?'on':'')+'" style="--c:'+s.color+'">'+(n?n+' حصة هذا الأسبوع':'لا حصص هذا الأسبوع')+'</span></button>';
  }).join('');
  return '<p class="eyebrow">أهلًا '+esc(me.name)+'</p><h1>مواد '+weekName(p.currentWeek)+'</h1>'+
    '<p class="sub">اختر المادة لعرض حصصها الأسبوعية.</p><div class="grid">'+cards+'</div>';
}
function openSubject(id){ curSubject=id; view='subject'; openWeek=P().currentWeek; render(); record(id); }

function subjectView(){
  const p=P(), s=subj(curSubject); let weeks='';
  for(let w=1;w<=p.weeks;w++){
    const ls=lessonsOf(p,s.id,w), open=openWeek===w;
    weeks+='<div class="week '+(w===p.currentWeek?'now':'')+'" style="--c:'+s.color+'">'+
      '<button class="whead" onclick="toggleWeek('+w+')" aria-expanded="'+open+'">'+
      '<span class="wname">'+weekName(w)+(w===p.currentWeek?'<span class="tag" style="--c:'+s.color+'">الأسبوع الحالي</span>':'')+'</span>'+
      '<span class="meta">'+(ls.length?ls.length+' حصة':'—')+'</span></button>'+
      (open?'<div class="wbody">'+(ls.length?ls.map(l=>
        '<div class="lesson"><div><div class="t">'+esc(l.title)+'</div><div class="d">'+esc(l.time||'')+'</div></div>'+
        (l.url?'<a class="join" style="--c:'+s.color+'" href="'+esc(l.url)+'" target="_blank" rel="noopener">دخول الحصة</a>'
              :'<span class="meta">الرابط لم يُضف بعد</span>')+'</div>').join('')
        :'<div class="empty">لا توجد حصص في هذا الأسبوع. يضيفها المعلّم من لوحة التحكم.</div>')+'</div>':'')+'</div>';
  }
  return '<button class="btn ghost small" onclick="view=\'home\';render()">رجوع للمواد</button>'+
    '<h1 style="margin-top:14px;color:'+s.color+'">'+esc(s.name)+'</h1><p class="sub">حصص مرتبة حسب الأسبوع.</p>'+weeks;
}
function toggleWeek(w){ openWeek=(openWeek===w?null:w); render(); }

/* ===== لوحة المعلّم ===== */
function adminView(){
  const p=AP(), gold=adminPortal==='paid';
  const opts=SUBJECTS.map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join('');
  let wopts=''; for(let w=1;w<=p.weeks;w++) wopts+='<option value="'+w+'" '+(w===p.currentWeek?'selected':'')+'>'+weekName(w)+'</option>';

  const list=SUBJECTS.map(s=>{
    let out='';
    for(let w=1;w<=p.weeks;w++){
      const ls=lessonsOf(p,s.id,w); if(!ls.length) continue;
      out+='<div style="margin-top:8px"><div class="meta">'+weekName(w)+'</div>'+ls.map((l,i)=>
        '<div class="lesson"><div><div class="t">'+esc(l.title)+'</div><div class="d">'+esc(l.time||'')+(l.url?' · رابط مضاف':' · بلا رابط')+'</div></div>'+
        '<button class="del" onclick="delLesson(\''+s.id+'\','+w+','+i+')">حذف</button></div>').join('')+'</div>';
    }
    return out?'<div style="margin-top:14px"><h3 style="color:'+s.color+'">'+esc(s.name)+'</h3>'+out+'</div>':'';
  }).join('') || '<p class="empty">لم تُضف أي حصة في هذه البوابة.</p>';

  const rows=log.slice().reverse().map(e=>'<tr><td>'+esc(e.n)+'</td><td class="num">'+esc(e.p)+'</td>'+
    '<td>'+(e.g==='paid'?'مشتركين':'عامة')+'</td><td>'+(e.s?esc((subj(e.s)||{}).name||e.s):'تسجيل دخول')+'</td>'+
    '<td class="meta">'+fmt(e.t)+'</td></tr>').join('');

  const codes=p.codes||[];
  const codeRows=codes.slice().reverse().map((c,i)=>'<tr><td><code>'+esc(c.code)+'</code></td>'+
    '<td>'+(c.by?esc(c.name||'—'):'<span class="meta">غير مستخدم</span>')+'</td>'+
    '<td class="num">'+(c.by?esc(c.by):'—')+'</td>'+
    '<td><button class="del" onclick="delCode(\''+esc(c.code)+'\')">حذف</button></td></tr>').join('');

  return '<h1>لوحة المعلّم</h1><p class="sub">اختر البوابة التي تريد تحريرها.</p>'+
  '<div class="tabs">'+
    '<button class="'+(adminPortal==='free'?'on':'')+'" onclick="adminPortal=\'free\';render()">'+esc(conf.portals.free.title)+'</button>'+
    '<button class="'+(gold?'on gold':'')+'" onclick="adminPortal=\'paid\';render()">'+esc(conf.portals.paid.title)+'</button>'+
  '</div>'+

  '<div class="panel"><h2>إضافة حصة — '+esc(p.title)+'</h2>'+
    '<div class="row"><div><label for="asub">المادة</label><select id="asub">'+opts+'</select></div>'+
    '<div><label for="aweek">الأسبوع</label><select id="aweek">'+wopts+'</select></div></div>'+
    '<label for="atitle">عنوان الحصة</label><input id="atitle" placeholder="مثال: الكسور العشرية — الدرس الثاني">'+
    '<label for="atime">اليوم والوقت</label><input id="atime" placeholder="مثال: الأحد ٩:٠٠ صباحًا">'+
    '<label for="aurl">رابط الحصة</label><input id="aurl" type="url" dir="ltr" placeholder="https://meet.google.com/...">'+
    '<button class="btn" onclick="addLesson()">حفظ الحصة</button></div>'+

  (gold?
  '<div class="panel"><h2>رموز الاشتراك</h2>'+
    '<p class="meta">أنشئ الرموز وسلّمها للطالب بعد تأكد الدفع. كل رمز يرتبط بأول رقم يستخدمه.</p>'+
    '<div class="row" style="margin-top:10px"><div style="max-width:150px"><label for="ncodes">كم رمزًا؟</label><input id="ncodes" type="number" min="1" max="50" value="5"></div></div>'+
    '<button class="btn gold" onclick="genCodes()">إنشاء الرموز</button>'+
    (codes.length?'<div class="scroll"><table><thead><tr><th>الرمز</th><th>المشترك</th><th>الجوال</th><th></th></tr></thead><tbody>'+codeRows+'</tbody></table></div>'+
      '<button class="btn ghost small" style="margin-top:12px" onclick="copyFree()">نسخ الرموز غير المستخدمة</button>':'<p class="empty">لا توجد رموز بعد.</p>')+
    '<label for="price" style="margin-top:18px">سعر الاشتراك</label><input id="price" value="'+esc(p.price||'')+'">'+
    '<label for="payurl">رابط صفحة الدفع (ميسر / تاب / Stripe / PayPal)</label><input id="payurl" dir="ltr" value="'+esc(p.payUrl||'')+'" placeholder="https://...">'+
    '<label for="paynote">ما يحدث بعد الدفع</label><input id="paynote" value="'+esc(p.payNote||'')+'">'+
    '<button class="btn ghost small" style="margin-top:14px" onclick="savePay()">حفظ إعدادات الدفع</button></div>'
  :'<div class="panel"><h2>رمز الدخول العام</h2><label for="scode">الرمز الذي يوزّع على الطلاب</label>'+
    '<input id="scode" value="'+esc(conf.portals.free.code)+'"><button class="btn ghost small" style="margin-top:14px" onclick="saveFreeCode()">حفظ الرمز</button></div>')+

  '<div class="panel"><h2>إعدادات '+esc(p.title)+'</h2>'+
    '<label for="ptitle">اسم البوابة</label><input id="ptitle" value="'+esc(p.title)+'">'+
    '<label for="pdesc">وصفها في الصفحة الرئيسية</label><input id="pdesc" value="'+esc(p.desc||'')+'">'+
    '<div class="row" style="margin-top:6px">'+
      '<div><label for="cweek">الأسبوع الحالي</label><select id="cweek">'+wopts+'</select></div>'+
      '<div><label for="nweeks">عدد الأسابيع</label><input id="nweeks" type="number" min="1" max="12" value="'+p.weeks+'"></div></div>'+
    '<label for="ann">إعلان يظهر لطلاب هذه البوابة</label><textarea id="ann" rows="3" placeholder="مثال: حصة الرياضيات اليوم متأخرة نصف ساعة.">'+esc(p.announce)+'</textarea>'+
    '<div class="row" style="margin-top:6px"><div><label for="glbl">نص زر المجموعة</label><input id="glbl" value="'+esc(p.groupLabel)+'"></div>'+
    '<div><label for="gurl">رابط القناة أو القروب</label><input id="gurl" dir="ltr" value="'+esc(p.groupUrl)+'" placeholder="https://chat.whatsapp.com/..."></div></div>'+
    '<button class="btn" onclick="savePortal()">حفظ ونشر</button></div>'+

  '<div class="panel"><h2>الحصص المضافة</h2>'+list+'</div>'+

  '<div class="panel"><h2>إعدادات الموقع</h2>'+
    '<label for="stitle">عنوان الصفحة الرئيسية</label><input id="stitle" value="'+esc(conf.siteTitle)+'">'+
    '<label for="sline">الجملة تحته</label><input id="sline" value="'+esc(conf.siteLine)+'">'+
    '<div class="row" style="margin-top:6px"><div><label for="acode">رمز المعلّم</label><input id="acode" value="'+esc(conf.adminCode)+'"></div>'+
    '<div><label for="cc">مفتاح الدولة</label><input id="cc" dir="ltr" value="'+esc(conf.cc)+'"></div></div>'+
    '<button class="btn ghost small" style="margin-top:14px" onclick="saveSite()">حفظ</button></div>'+

  '<div class="panel"><h2>سجل الدخول ('+log.length+')</h2>'+
    (log.length?'<div class="scroll"><table><thead><tr><th>الاسم</th><th>الجوال</th><th>البوابة</th><th>البطاقة</th><th>الوقت</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
      '<div class="row" style="margin-top:14px">'+
      '<button class="btn ghost small" onclick="showPhones()">نسخ الأرقام للإرسال الجماعي</button>'+
      '<button class="btn ghost small" onclick="showCsv()">عرض القائمة كاملة</button>'+
      '<button class="btn danger small" onclick="clearLog()">مسح السجل</button></div>'+
      '<textarea id="csv" rows="6" dir="ltr" style="display:none;margin-top:10px"></textarea>'
    :'<p class="empty">لم يدخل أحد بعد.</p>')+'</div>';
}

async function addLesson(){
  const p=AP(), sid=document.getElementById('asub').value, w=+document.getElementById('aweek').value;
  const title=document.getElementById('atitle').value.trim();
  const time=document.getElementById('atime').value.trim();
  const url=safeUrl(document.getElementById('aurl').value);
  if(!title){ toast('اكتب عنوان الحصة'); return; }
  p.lessons[sid]=p.lessons[sid]||{}; p.lessons[sid][w]=p.lessons[sid][w]||[];
  p.lessons[sid][w].push({title,time,url});
  await saveConf(); toast('تمت إضافة الحصة'); render();
}
async function delLesson(sid,w,i){ AP().lessons[sid][w].splice(i,1); await saveConf(); toast('حُذفت الحصة'); render(); }

async function savePortal(){
  const p=AP();
  p.title=document.getElementById('ptitle').value.trim()||p.title;
  p.desc=document.getElementById('pdesc').value.trim();
  p.currentWeek=+document.getElementById('cweek').value;
  p.weeks=Math.min(12,Math.max(1,+document.getElementById('nweeks').value||8));
  if(p.currentWeek>p.weeks) p.currentWeek=p.weeks;
  p.announce=document.getElementById('ann').value.trim();
  p.groupLabel=document.getElementById('glbl').value.trim()||'انضم للمجموعة';
  p.groupUrl=document.getElementById('gurl').value.trim();
  await saveConf(); toast('حُفظ ونُشر'); render();
}
async function saveFreeCode(){
  const v=document.getElementById('scode').value.trim();
  if(!v){ toast('لا تترك الرمز فارغًا'); return; }
  conf.portals.free.code=v; await saveConf(); toast('حُفظ الرمز');
}
async function savePay(){
  const p=conf.portals.paid;
  p.price=document.getElementById('price').value.trim();
  p.payUrl=document.getElementById('payurl').value.trim();
  p.payNote=document.getElementById('paynote').value.trim();
  await saveConf(); toast('حُفظت إعدادات الدفع'); render();
}
async function saveSite(){
  conf.siteTitle=document.getElementById('stitle').value.trim()||conf.siteTitle;
  conf.siteLine=document.getElementById('sline').value.trim();
  const a=document.getElementById('acode').value.trim(); if(a) conf.adminCode=a;
  conf.cc=document.getElementById('cc').value.replace(/\D/g,'');
  await saveConf(); toast('حُفظت الإعدادات');
}
async function genCodes(){
  const n=Math.min(50,Math.max(1,+document.getElementById('ncodes').value||1));
  const p=conf.portals.paid;
  for(let i=0;i<n;i++) p.codes.push({code:newCode(),by:'',name:'',ts:0});
  await saveConf(); toast('أُنشئ '+n+' رمزًا'); render();
}
async function delCode(code){
  const p=conf.portals.paid;
  p.codes=p.codes.filter(c=>c.code!==code);
  await saveConf(); toast('حُذف الرمز'); render();
}
function copyFree(){
  const free=conf.portals.paid.codes.filter(c=>!c.by).map(c=>c.code);
  if(!free.length){ toast('كل الرموز مستخدمة'); return; }
  try{ navigator.clipboard.writeText(free.join('\n')); }catch(e){}
  toast(free.length+' رمزًا نُسخ');
}
function showPhones(){
  const seen=new Set(), nums=[];
  log.forEach(e=>{ const ph=intlPhone(e.p); if(ph&&!seen.has(ph)){ seen.add(ph); nums.push(ph); } });
  const t=document.getElementById('csv'); t.style.display='block'; t.value=nums.join('\n'); t.select();
  try{ navigator.clipboard.writeText(t.value); }catch(e){}
  toast(nums.length+' رقمًا جاهزًا — انسخه');
}
function showCsv(){
  const t=document.getElementById('csv'); t.style.display='block';
  t.value='الاسم,الجوال,البوابة,البطاقة,الوقت\n'+log.slice().reverse().map(e=>
    [e.n,e.p,(e.g==='paid'?'مشتركين':'عامة'),(e.s?((subj(e.s)||{}).name||e.s):'تسجيل دخول'),fmt(e.t)].join(',')).join('\n');
  t.select();
}
async function clearLog(){
  if(!confirm('سيُمسح السجل نهائيًا. متابعة؟')) return;
  log=[]; await sset(K_LOG,log,true); toast('مُسح السجل'); render();
}
boot();
</script>
</body>
</html>
